<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo con Degradado Azul/Morado Tecnológico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Degradado Neón para el Módulo AI -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado (App Icon Style) -->
  <rect width="500" height="500" rx="110" fill="url(#bgGrad)"/>

  <g transform="translate(0, -10)">
    <!-- PIN DE UBICACIÓN Y CIRCUITOS DE IA -->
    <!-- Pin Exterior -->
    <path d="M250 80 C170 80 105 145 105 225 C105 315 250 410 250 410 C250 410 395 315 395 225 C395 145 330 80 250 80 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Nodo de Circuito IA (Lado Izquierdo) -->
    <path d="M105 225 L65 225 C55 225 50 230 50 240 L50 270" 
          fill="none" 
          stroke="url(#aiGrad)" 
          stroke-width="12" 
          stroke-linecap="round"/>
    <circle cx="50" cy="275" r="10" fill="url(#aiGrad)" />

    <!-- Nodo de Circuito IA (Lado Derecho) -->
    <path d="M395 225 L435 225 C445 225 450 230 450 240 L450 270" 
          fill="none" 
          stroke="url(#aiGrad)" 
          stroke-width="12" 
          stroke-linecap="round"/>
    <circle cx="450" cy="275" r="10" fill="url(#aiGrad)" />

    <!-- ICONO DE ALERTA DE MANTENIMIENTO (Centro) -->
    <!-- Engranaje / Escudo de Alerta -->
    <circle cx="250" cy="215" r="65" fill="#FFFFFF" opacity="0.15" />
    
    <!-- Signo de Exclamación / Alerta -->
    <path d="M250 160 L250 230" 
          stroke="#00F2FE" 
          stroke-width="20" 
          stroke-linecap="round" />
    <circle cx="250" cy="270" r="12" fill="#00F2FE" />
  </g>

  <!-- TEXTO CAMPUSALERT AI -->
  <text x="250" y="445" 
        font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="36" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="2">
    CampusAlert <tspan fill="#00F2FE">AI</tspan>
  </text>
</svg>
